<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뉴스 브리핑 목록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #f5f6f8;
      color: #1a1a2e;
      line-height: 1.7;
      padding: 32px 16px 64px;
    }
    .container { max-width: 720px; margin: 0 auto; }

    header {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
      border-left: 6px solid #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #1e3a8a; }
    header .meta { margin-top: 4px; font-size: 0.84rem; color: #64748b; }

    .list {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .list-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-bottom: 1px solid #f1f5f9;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: #eff6ff; }

    .item-icon { font-size: 1.2rem; flex-shrink: 0; }
    .item-body { flex: 1; min-width: 0; }
    .item-title {
      font-size: 0.97rem;
      font-weight: 600;
      color: #1e3a8a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-date { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
    .item-arrow { color: #94a3b8; font-size: 0.9rem; flex-shrink: 0; }

    .empty {
      padding: 40px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 28px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>뉴스 브리핑 목록</h1>
    <div class="meta">생성된 뉴스 브리핑 파일 목록입니다.</div>
  </header>

  <div class="list" id="file-list">
    <!-- JS가 비활성화된 환경을 위한 정적 목록 -->
    <a class="list-item" href="news_2026-06-19_글로벌금융경제동향.html">
      <span class="item-icon">📰</span>
      <div class="item-body">
        <div class="item-title">글로벌금융경제동향</div>
        <div class="item-date">2026-06-19</div>
      </div>
      <span class="item-arrow">›</span>
    </a>
  </div>

  <footer>뉴스 브리핑 자동 생성 시스템</footer>
</div>
</body>
</html>
